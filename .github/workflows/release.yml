name: release

# Tagging v* builds the macOS binaries, publishes them as release assets, and
# rewrites the Homebrew formula to point at them. No hand-edited checksums.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon runner; the Intel binary is cross-compiled from it, so this
    # does not depend on the retired macos-13 Intel images.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check the tag matches Cargo.toml
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Sync the lockfile to the released version
        # Cargo.lock records the version of tenki itself, so bumping Cargo.toml
        # without rebuilding leaves it stale and every --locked command below
        # fails. Refresh just that entry offline: no dependency can move, and
        # --locked still pins the rest of the graph exactly as committed.
        run: |
          cargo update --offline --package tenki --precise "$VERSION"
          git diff --stat -- Cargo.lock

      - name: Add targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package
        run: |
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            tar -czf "dist/tenki-${VERSION}-${target}.tar.gz" \
              -C "target/${target}/release" tenki
          done
          cd dist && shasum -a 256 *.tar.gz | tee checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz --clobber
          else
            gh release create "$TAG" dist/*.tar.gz \
              --title "$TAG" --generate-notes
          fi

      - name: Rewrite the formula to install the prebuilt binaries
        run: |
          sha_for() { awk -v f="$1" '$2 == f || $2 == "*"f {print $1}' dist/checksums.txt; }
          ARM_SHA=$(sha_for "tenki-${VERSION}-aarch64-apple-darwin.tar.gz")
          INTEL_SHA=$(sha_for "tenki-${VERSION}-x86_64-apple-darwin.tar.gz")
          for sha in "$ARM_SHA" "$INTEL_SHA"; do
            [ ${#sha} -eq 64 ] || { echo "::error::bad checksum: '$sha'"; exit 1; }
          done
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          cat > Formula/tenki.rb <<FORMULA
          class Tenki < Formula
            desc "Animated terminal weather visualisation in pastel ASCII art"
            homepage "https://github.com/${{ github.repository }}"
            version "${VERSION}"
            license "MIT"

            # Prebuilt binaries: installing needs no Rust toolchain and no
            # compilation. This file is generated by .github/workflows/release.yml.
            on_macos do
              on_arm do
                url "${BASE}/tenki-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_SHA}"
              end
              on_intel do
                url "${BASE}/tenki-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${INTEL_SHA}"
              end
            end

            # \`brew install --HEAD\` still builds current main from source.
            head do
              url "https://github.com/${{ github.repository }}.git", branch: "main"
              depends_on "rust" => :build
            end

            def install
              if build.head?
                system "cargo", "install", *std_cargo_args
              else
                bin.install "tenki"
              end
            end

            test do
              assert_match "tenki", shell_output("#{bin}/tenki --version")
              assert_match "Open-Meteo", shell_output("#{bin}/tenki --help")
            end
          end
          FORMULA
          cat Formula/tenki.rb

      - name: Commit the formula to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The lockfile sync above is build-local; drop it so switching branches
          # is never blocked by an uncommitted change.
          git checkout -- Cargo.lock
          git fetch origin main
          git checkout main
          git add Formula/tenki.rb
          if git diff --staged --quiet; then
            echo "formula already up to date"
          else
            git commit -m "build: formula for ${TAG} [skip ci]"
            git push origin main
          fi
